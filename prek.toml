# Hooks that apply to the whole repo. Language-specific hooks live in
# backend/prek.toml and web/prek.toml, which prek discovers and runs with
# that directory as the working directory.
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/hukkin/mdformat"
rev = "1.0.0"
hooks = [
    # mdformat-gfm adds GitHub-flavored support (tables, task lists,
    # strikethrough) so README constructs survive formatting. Vendored agent
    # skills are excluded: they belong to their upstream and skills-lock.json
    # tracks them by hash, so reformatting them would read as drift.
    { id = "mdformat", additional_dependencies = ["mdformat-gfm"], exclude = '^\.agents/skills/' },
]
