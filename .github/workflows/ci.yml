name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a new push to a PR) so CI
# isn't doing redundant work on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Installs the tools pinned in mise.toml, then runs its postinstall hook,
      # which installs both services' dependencies. One source of truth for the
      # toolchain, shared with local development.
      - uses: jdx/mise-action@v4

      # The same task you run locally: type-checks the backend with `ty` and
      # the web app with svelte-check + tsc.
      - name: Type check
        run: mise run check

      # Fixers run in place; if any hook modifies a file the step exits
      # non-zero, which blocks the PR: exactly the gate we want.
      - name: Lint and format
        run: prek run --all-files --show-diff-on-failure

      - name: Build
        run: mise run build
